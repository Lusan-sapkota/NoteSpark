plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.styledtext'
version = '1.0.0'

android {
  namespace "expo.modules.styledtext"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // For React Native 0.71 and later the React Native Gradle plugin swaps this for com.facebook.react:react-android.
  implementation "com.facebook.react:react-native:+"
}
