# Publishes the website (web/) to GitHub Pages whenever something under web/ changes on main.
# One-time setup in the repository: Settings, Pages, Source: "GitHub Actions" (then set the custom domain there).
name: Website

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Only what the Pages deployment needs; no secrets are used anywhere in this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      # Cloudflare caches .js and .css for 4 hours; a commit-stamped query makes
      # each deploy a fresh URL, so a release notice never stays stale at the edge.
      - name: Version the assets
        run: |
          sed -i "s|src=\"\./app\.js\"|src=\"./app.js?v=${GITHUB_SHA}\"|g" web/*.html
          sed -i "s|href=\"\./assets/styles\.css\"|href=\"./assets/styles.css?v=${GITHUB_SHA}\"|g" web/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
